<!DOCTYPE html>
<html lang="PT-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Homepage</title>
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body class="homepage_body">
    <header></header>
    <img
      class="homepage_logotipo"
      src="../pictures/logotipo.svg"
      alt="logotipo"
    />
    <div class="homepage_options">
    <form action="#" method="get" class="homepage_search_form">
      <input
        type="text"
        name="search"
        placeholder="Pesquisar..."
        class="homepage_search_input"
      />
      <button type="submit" class="homepage_search_button"><img src="../pictures/homepage_lupa.svg" alt="lupa"></button>
    </form>
    <button type="button" class="homepage_add"><img src="../pictures/homepage_button_plus.svg" alt=""></button>
    </div>
  </body>
</html>
