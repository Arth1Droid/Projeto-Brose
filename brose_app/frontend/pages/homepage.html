<!DOCTYPE html>
<html lang="PT-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Homepage</title>
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body>

    <!-- HEADER BROSE -->
    <header>
       <img
      class="homepage_logotipo"
      src="../pictures/logotipo.svg"
      alt="logotipo"
    />
    </header>


    <!-- CASO QUEIRA CENTRALIZAR A PAGINA AO CENTR0 SÓ USAR ESSA CLASSE ABAIXO -->
    <div class="homepage_body">
 
    <!-- INFORMAÇOES DA PAGINA  -->
      <div class="info">
        <h1>Produtos Cadastrados</h1>
        <p>Gerencie e visualize todos os produtos do sistema.</p>
      </div>
      

      <!-- bARRA DE PESQUISA, ADIÇÃO E GERAR RELATORIOIS -->
      <div class="homepage_options">
        <!-- PESQUISA  -->
        <form action="#" method="get" class="homepage_search_form">
          <input
            type="text"
            name="q"
            placeholder="Pesquisar..."
            class="homepage_search_input"
          />
          <button type="submit" class="homepage_search_button">
            <img src="../pictures/homepage_lupa.svg" alt="lupa" />
          </button>
        </form>

        <!-- ENVIAR  -->
        <button type="button" class="homepage_add">
          <img src="../pictures/homepage_button_plus.svg" alt="" />
        </button>

        <!-- GERAR  -->
        <button type="button" class="red-button">Gerar Relatorio</button>
      </div>

      <!-- GRID PRINCIPAL -->
      <main class="grid-main">

        <!-- CLASSE DE ITEMS  -->
        <div class="items">
          <h2>Alicate</h2>
          <p>Ferramenta</p>
          <div class="buttons-main">
            <button type="button" class="detail-button">Ver Detalhes</button>
            <button type="button" class="red-button">Excluir</button>
          </div>
        </div>

        <div class="items">
          <h2>Martelo</h2>
          <p>Ferramenta</p>
          <div class="buttons-main">
            <button type="button" class="detail-button">Ver Detalhes</button>
            <button type="button" class="red-button">Excluir</button>
          </div>
        </div>

      </main>
    

      <!-- MENSAGEM OCULTA -->
      <section class="notfound-item">
        <img src="../pictures/status-error-filled-svgrepo-com.svg" alt="" id="notfound-img">
        <h2 id="notfound-message">Nenhuma peça foi encontrada. :(</h2>
      </section>


    </div>
    
      <!-- MODAL REGISTRO -->
      <div id="successModal" class="modal-overlay">
            <div class="modal-content">
                <div class="modal-icon-container">
                    <svg class="modal-icon" viewBox="0 0 24 24">
                        <path fill="white" d="M9.86 18a1 1 0 01-.73-.31l-4.24-4.24a1 1 0 111.41-1.41L9.86 15.59l6.93-6.93a1 1 0 111.41 1.41l-7.66 7.66a1 1 0 01-.73.31z"/>
                    </svg>
                </div>
                <p class="modal-message">
                    Produto registrado com sucesso!
                </p>
            </div>
        </div>
        <!-- Modal de Cadastro de Produto -->
      <div id="cadastroModal" class="modal">
        <div class="modal-content">
          <button class="close-btn" id="closeModal">&times;</button>
          <h2>Cadastrar Novo Produto</h2>
          <p class="subtitle">Preencha as informações do produto</p>

          <form id="productForm">
            <label for="productName">Nome do Produto</label>
            <input type="text" id="productName" placeholder="Digite o nome do produto" required />

            <label for="productDesc">Descrição</label>
            <input type="text" id="productDesc" placeholder="Digite uma breve descrição do produto" required />

            <div class="buttons">
              <button type="button" class="cancel-btn">Cancelar</button>
              <button type="submit" class="continue-btn">Continuar</button>
            </div>
          </form>
        </div>
      </div>
        
    
    <script src="../scripts/homepage.js"></script>
    <script src="../scripts/modal.js"></script>
  </body>
</html>
