<!DOCTYPE html>
<html lang="PT-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Landpage</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body class="index_body">
    <section class="index_info">
      <div>
        <form class="index_form" action="#" method="post">
          <div class="index_form_space">
            <label for="usuario">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="Digite seu email"
              required
            />
          </div>
          <div class="index_form_space">
            <label for="usuario">Senha</label>
            <input
              type="password"
              id="senha"
              name="senha"
              placeholder="Digite sua senha"
              required
            />
          </div>
        </form>
      </div>
    </section>
    <section class="index_logotipo">
      <img
        id="index_logotipo"
        src="./pictures/index_logotipo.svg"
        alt="logotipo"
      />
    </section>
  </body>
</html>
